<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>양자 프로그램 A · 1~5차시 시뮬레이션</title>
<style>
:root{
  --ink:#1F2433; --sub:#5B6275; --line:#D5D9E2; --bg:#F5F7FA; --card:#FFFFFF;
  --acc:#2B3A78; --acc2:#E39B2D; --tint:#EEF1F8; --good:#2E8B6E; --bad:#B23A2A;
  --font:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--acc);color:#fff;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
header .kicker{font-size:13px;opacity:.8}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0;background:var(--bg)}
nav button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
main{flex:1;min-height:0;padding:12px 18px 18px}
.tab{display:none;height:100%;gap:14px;grid-template-columns:minmax(0,1fr) 340px}
.tab.on{display:grid}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.stage .cv{flex:1;min-height:260px;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.readout{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
.chip{background:var(--tint);border-radius:10px;padding:6px 12px;font-size:15px}
.chip b{font-size:18px;color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:18px;margin:0;color:var(--acc)}
.panel .hint{font-size:14px;color:var(--sub);margin:0}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:14px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.ctl label output{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}
select{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;border:1px solid var(--acc);background:#fff;color:var(--acc);padding:7px 12px;border-radius:9px;cursor:pointer}
.btn.fill{background:var(--acc);color:#fff}
.btn:active{transform:translateY(1px)}
.check{display:flex;align-items:center;gap:6px;font-size:15px}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}
.note b{color:var(--acc)}
table.rec{border-collapse:collapse;width:100%;font-size:13px}
table.rec th,table.rec td{border:1px solid var(--line);padding:3px 5px;text-align:center}
table.rec th{background:var(--tint)}
.big{font-size:28px;font-weight:700;color:var(--acc)}
@media (max-width:900px){.tab.on{grid-template-columns:1fr;grid-template-rows:minmax(320px,60vh) auto}main{overflow:auto}}
:root{--acc:#2B3A78;--acc2:#E39B2D;--tint:#EEF1F8;}
</style></head>
<body>
<header><h1>양자 프로그램 A · 1~5차시 시뮬레이션</h1><span class="kicker">인터넷 없이 브라우저에서 바로 열린다. 위 탭에서 차시를 고른다.</span></header>
<nav aria-label="차시별 시뮬레이션"></nav>
<main></main>
<script>
// ── 공통: 탭, 캔버스, 조작 요소
const SIM = { mods: [], cur: null };
SIM.add = m => SIM.mods.push(m);

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.flat().forEach(k => k != null && e.append(k.nodeType ? k : document.createTextNode(k)));
  return e;
}
// 캔버스: 부모 크기에 맞춰 자동 조정, draw(ctx, W, H)
function mkCanvas(parent) {
  const box = el('div', { class: 'cv' }); const cv = el('canvas'); box.append(cv); parent.append(box);
  const o = { cv, ctx: cv.getContext('2d'), W: 0, H: 0 };
  const fit = () => {
    const r = box.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!r.width) return;
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    o.ctx.setTransform(d, 0, 0, d, 0, 0); o.W = r.width; o.H = r.height; o.onfit && o.onfit();
  };
  new ResizeObserver(fit).observe(box); o.fit = fit;
  return o;
}
function slider(parent, label, min, max, step, val, fmt, on) {
  const out = el('output'); const inp = el('input', { type: 'range', min, max, step, value: val });
  const set = () => { out.textContent = fmt(+inp.value); on && on(+inp.value); };
  inp.addEventListener('input', set);
  parent.append(el('div', { class: 'ctl' }, el('label', {}, el('span', {}, label), out), inp));
  set();
  return { get v() { return +inp.value; }, set(v) { inp.value = v; set(); }, inp };
}
function select(parent, label, opts, on) {
  const s = el('select', {}, ...opts.map(([v, t]) => el('option', { value: v }, t)));
  s.addEventListener('change', () => on && on(s.value));
  parent.append(el('div', { class: 'ctl' }, el('label', {}, el('span', {}, label)), s));
  return s;
}
function check(parent, label, val, on) {
  const c = el('input', { type: 'checkbox' }); c.checked = val;
  c.addEventListener('change', () => on && on(c.checked));
  parent.append(el('label', { class: 'check' }, c, label));
  return c;
}
function btns(parent, list) { // [[글, fn, fill?]]
  const r = el('div', { class: 'row' });
  list.forEach(([t, f, fill]) => r.append(el('button', { class: 'btn' + (fill ? ' fill' : ''), onclick: f }, t)));
  parent.append(r); return r;
}
function chips(parent, names) {
  const r = el('div', { class: 'readout' }); const o = {};
  names.forEach(([k, lab]) => { const b = el('b'); o[k] = b; r.append(el('span', { class: 'chip' }, lab + ' ', b)); });
  parent.append(r); return o;
}
// 기록 표
function recTable(parent, heads) {
  const t = el('table', { class: 'rec' }, el('tr', {}, ...heads.map(h => el('th', {}, h))));
  const wrap = el('div', {}, t);
  parent.append(wrap);
  return { add(vals) { t.append(el('tr', {}, ...vals.map(v => el('td', {}, v)))); }, clear() { while (t.rows.length > 1) t.deleteRow(1); } };
}
// 파장(nm) → 색
function wlColor(nm, a = 1) {
  let r = 0, g = 0, b = 0;
  if (nm < 380) { r = .55; g = 0; b = .85; }
  else if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
  else { r = 1; }
  let f = 1;
  if (nm >= 380 && nm < 420) f = .35 + .65 * (nm - 380) / 40; else if (nm > 700) f = .35 + .65 * (780 - nm) / 80;
  if (nm < 380) f = .8;
  return `rgba(${Math.round(255 * r * f)},${Math.round(255 * g * f)},${Math.round(255 * b * f)},${a})`;
}
function wlName(nm) {
  if (nm < 380) return '자외선'; if (nm < 450) return '보라'; if (nm < 495) return '파랑'; if (nm < 570) return '초록';
  if (nm < 590) return '노랑'; if (nm < 620) return '주황'; if (nm <= 750) return '빨강'; return '적외선';
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function arrow(ctx, x1, y1, x2, y2, col, w = 3, head = 10) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - head * Math.cos(a - .45), y2 - head * Math.sin(a - .45)); ctx.lineTo(x2 - head * Math.cos(a + .45), y2 - head * Math.sin(a + .45)); ctx.closePath(); ctx.fill();
}
function text(ctx, s, x, y, o = {}) {
  ctx.font = `${o.bold ? '700 ' : ''}${o.size || 15}px ${css('--font')}`; ctx.fillStyle = o.color || css('--ink');
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y);
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
// 무작위 표본: 확률밀도 배열에서 위치 하나
function sampler(pdf) { const c = []; let s = 0; pdf.forEach(p => { s += p; c.push(s); }); return () => { const u = Math.random() * s; let lo = 0, hi = c.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (c[m] < u) lo = m + 1; else hi = m; } return lo; }; }

function boot() {
  const nav = document.querySelector('nav'), main = document.querySelector('main');
  SIM.mods.forEach((m, i) => {
    const tab = el('section', { class: 'tab', id: 'tab-' + m.id });
    const stage = el('div', { class: 'stage' }), panel = el('div', { class: 'panel' });
    panel.append(el('h2', {}, m.title || m.label));
    if (m.hint) panel.append(el('p', { class: 'hint' }, m.hint));
    tab.append(stage, panel); main.append(tab);
    const b = el('button', { onclick: () => show(i) }, m.label); nav.append(b);
    m._tab = tab; m._btn = b;
    try { m._api = m.build(stage, panel); } catch (err) { console.error(m.id, err); m._api = {}; stage.append(el('p', {}, '이 시뮬레이션을 불러오지 못했습니다: ' + err.message)); }
  });
  let raf = 0, last = 0;
  function loop(t) { const m = SIM.cur; const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; if (m && m._api.frame) m._api.frame(dt); raf = requestAnimationFrame(loop); }
  function show(i) {
    SIM.mods.forEach((m, k) => { m._tab.classList.toggle('on', k === i); m._btn.classList.toggle('on', k === i); });
    SIM.cur = SIM.mods[i]; requestAnimationFrame(() => { SIM.cur._api.show && SIM.cur._api.show(); });
    try { location.hash = SIM.mods[i].id; } catch (e) { }
  }
  const h = (location.hash || '').slice(1); const k = SIM.mods.findIndex(m => m.id === h);
  show(k >= 0 ? k : 0); raf = requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded', boot);

// ── 공통 모듈: 편광판, 광전 효과
function frac(v) {
  const F = [[1, '1'], [.5, '1/2'], [.25, '1/4'], [.125, '1/8'], [.0625, '1/16'], [0, '0']];
  for (const [x, s] of F) if (Math.abs(v - x) < 1e-4) return s;
  return (v * 100).toFixed(1) + '%';
}

function polarizerMod(o) {
  return {
    id: o.id, label: o.label, title: o.title, hint: o.hint,
    build(stage, panel) {
      const C = mkCanvas(stage);
      const out = chips(stage, [['i', '화면에 도달한 빛의 세기(처음 = 1)'], ['p', '맨 끝 빛의 편광 방향']]);
      const P = [{ on: true, a: 0 }, { on: false, a: 45 }, { on: true, a: 90 }];
      const sl = [];
      const names = ['편광판 1', '편광판 2 (가운데)', '편광판 3'];
      P.forEach((p, i) => {
        const box = el('div', { class: 'note' });
        const c = check(box, names[i] + ' 넣기', p.on, v => { p.on = v; draw(); });
        sl.push({ c, s: slider(box, '투과축 각도', 0, 180, 5, p.a, v => v + '°', v => { p.a = v; draw(); }) });
        panel.append(box);
      });
      panel.append(el('p', { class: 'hint' }, '각도는 가로 방향을 0°로 잰다. 0° = 가로, 90° = 세로.'));
      const preset = (cfg) => { cfg.forEach(([on, a], i) => { P[i].on = on; P[i].a = a; sl[i].c.checked = on; sl[i].s.set(a); }); draw(); };
      btns(panel, [['두 장 나란히', () => preset([[1, 0], [0, 45], [1, 0]])], ['두 장 수직', () => preset([[1, 0], [0, 45], [1, 90]])]]);
      btns(panel, [['세 장 0°·45°·90°', () => preset([[1, 0], [1, 45], [1, 90]]), true], ['순서 0°·90°·45°', () => preset([[1, 0], [1, 90], [1, 45]])]]);
      let comp = false;
      if (o.components) check(panel, '편광 방향의 성분 보기', false, v => { comp = v; draw(); });
      panel.append(el('div', { class: 'note', html: o.note }));

      function draw() {
        const { ctx, W, H } = C; if (!W) return;
        ctx.clearRect(0, 0, W, H);
        const y = H * .58, bh = Math.max(26, H * .07), xs = [W * .3, W * .5, W * .7], x0 = W * .09, xS = W * .9;
        // 세기 계산
        let I = 1, pol = null; const seg = [{ x: x0, I: 1, pol: null }];
        P.forEach((p, i) => {
          if (!p.on) return;
          if (pol === null) I *= .5; else { const d = (p.a - pol) * Math.PI / 180; I *= Math.cos(d) ** 2; }
          if (I < 1e-9) I = 0;
          pol = p.a; seg.push({ x: xs[i], I, pol, from: i });
        });
        seg.push({ x: xS });
        // 광원
        ctx.fillStyle = '#FFD25A'; ctx.beginPath(); ctx.arc(x0 - 18, y, 22, 0, 7); ctx.fill();
        text(ctx, '광원', x0 - 18, y + 48, { align: 'center', color: css('--sub'), size: 14 });
        for (let k = 0; k < seg.length - 1; k++) {
          const a = seg[k], b = seg[k + 1];
          if (a.I > 0) { ctx.fillStyle = `rgba(255,190,60,${.1 + .85 * a.I})`; ctx.fillRect(a.x, y - bh / 2, b.x - a.x, bh); }
          const mx = (a.x + b.x) / 2;
          text(ctx, frac(a.I), mx, y - bh / 2 - 46, { align: 'center', bold: true, size: 20 });
          // 편광 표시
          const r = 16, cy = y - bh / 2 - 22;
          if (a.I > 0) {
            if (a.pol === null) { for (let t = 0; t < 4; t++) { const an = t * Math.PI / 4; ctx.strokeStyle = css('--sub'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx - r * Math.cos(an), cy - r * Math.sin(an) * .6); ctx.lineTo(mx + r * Math.cos(an), cy + r * Math.sin(an) * .6); ctx.stroke(); } }
            else { const an = a.pol * Math.PI / 180; ctx.strokeStyle = '#C47A12'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(mx - r * Math.cos(an), cy + r * Math.sin(an)); ctx.lineTo(mx + r * Math.cos(an), cy - r * Math.sin(an)); ctx.stroke(); }
          }
        }
        // 편광판
        P.forEach((p, i) => {
          const x = xs[i];
          ctx.globalAlpha = p.on ? 1 : .18;
          ctx.fillStyle = 'rgba(120,135,170,.25)'; ctx.strokeStyle = css('--acc'); ctx.lineWidth = 2;
          rrect(ctx, x - 7, y - H * .2, 14, H * .4, 4); ctx.fill(); ctx.stroke();
          // 정면에서 본 투과축
          const cy = y + H * .2 + 44, R = Math.min(34, H * .07);
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, cy, R, 0, 7); ctx.fill(); ctx.stroke();
          const an = p.a * Math.PI / 180;
          for (let k = -2; k <= 2; k++) { const ox = -Math.sin(an) * k * R * .32, oy = -Math.cos(an) * k * R * .32; const L = Math.sqrt(Math.max(0, R * R - (k * R * .32) ** 2)) * .92; ctx.strokeStyle = css('--acc'); ctx.lineWidth = k === 0 ? 3 : 1; ctx.beginPath(); ctx.moveTo(x + ox - L * Math.cos(an), cy - oy + L * Math.sin(an)); ctx.lineTo(x + ox + L * Math.cos(an), cy - oy - L * Math.sin(an)); ctx.stroke(); }
          text(ctx, `${names[i].split(' ')[0]} ${names[i].split(' ')[1]}  ${p.a}°`, x, cy + R + 22, { align: 'center', size: 14, bold: true, color: css('--acc') });
          ctx.globalAlpha = 1;
        });
        text(ctx, '정면에서 본 투과축 →', xs[0] - Math.min(34, H * .07) - 10, y + H * .2 + 48, { align: 'right', size: 13, color: css('--sub') });
        // 화면
        const fin = seg[seg.length - 2];
        ctx.fillStyle = '#2A2F3A'; ctx.fillRect(xS, y - H * .22, 12, H * .44);
        if (fin.I > 0) { const g = ctx.createRadialGradient(xS, y, 4, xS, y, H * .2); g.addColorStop(0, `rgba(255,210,90,${.15 + .85 * fin.I})`); g.addColorStop(1, 'rgba(255,210,90,0)'); ctx.fillStyle = g; ctx.fillRect(xS - H * .2, y - H * .22, H * .2 + 14, H * .44); }
        text(ctx, '화면', xS + 6, y + H * .22 + 20, { align: 'center', size: 14, color: css('--sub') });
        // 성분 보기
        if (comp) {
          let pv = null;
          P.forEach((p, i) => {
            if (!p.on) return;
            if (pv !== null) {
              const cx = xs[i], cy = H * .14, L = Math.min(46, H * .09), a0 = pv * Math.PI / 180, a1 = p.a * Math.PI / 180;
              ctx.strokeStyle = css('--line'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - L * 1.2 * Math.cos(a1), cy + L * 1.2 * Math.sin(a1)); ctx.lineTo(cx + L * 1.2 * Math.cos(a1), cy - L * 1.2 * Math.sin(a1)); ctx.stroke(); ctx.setLineDash([]);
              arrow(ctx, cx, cy, cx + L * Math.cos(a0), cy - L * Math.sin(a0), '#C47A12', 3, 9);
              const pr = Math.cos(a0 - a1) * L;
              if (Math.abs(pr) > 1) arrow(ctx, cx, cy, cx + pr * Math.cos(a1), cy - pr * Math.sin(a1), css('--acc'), 4, 9);
              text(ctx, `통과하는 성분 cos${Math.abs(p.a - pv)}°`, cx, cy + L + 18, { align: 'center', size: 12, color: css('--acc') });
            }
            pv = p.a;
          });
          text(ctx, '주황: 들어오는 빛의 진동 방향   남색: 투과축 방향 성분(통과)', W * .5, H * .03 + 12, { align: 'center', size: 13, color: css('--sub') });
        }
        out.i.textContent = frac(fin.I);
        out.p.textContent = fin.I > 0 && fin.pol !== null ? fin.pol + '°' : '—';
      }
      C.onfit = draw;
      return { show: () => { C.fit(); draw(); } };
    },
  };
}

// 광전 효과 (photons: 광자로 그릴지)
function photoMod(o) {
  return {
    id: o.id, label: o.label, title: o.title, hint: o.hint,
    build(stage, panel) {
      const C = mkCanvas(stage);
      const rd = chips(stage, o.photons ? [['f', '진동수'], ['e', '광자 하나의 에너지'], ['w', '일함수'], ['n', '1초에 나오는 전자'], ['k', '전자의 최대 운동 에너지']]
        : [['f', '진동수'], ['w', '일함수'], ['n', '1초에 나오는 전자'], ['k', '전자의 최대 운동 에너지']]);
      const METAL = { na: ['나트륨', 2.28], ca: ['칼슘', 2.87], zn: ['아연', 4.31], cu: ['구리', 4.65] };
      let metal = 'na';
      let ready = false;
      const wl = slider(panel, '빛의 파장', 200, 750, 5, 650, v => `${v} nm (${wlName(v)})`, () => ready && upd());
      const it = slider(panel, '빛의 세기', 0, 100, 5, 60, v => v + '%', () => ready && upd());
      select(panel, '금속판', Object.entries(METAL).map(([k, [n, w]]) => [k, `${n} (일함수 ${w} eV)`]), v => { metal = v; upd(); });
      const rec = el('div', { class: 'ctl' });
      btns(panel, [['결과 기록', () => { const s = st(); tab.add([wl.v, s.f.toFixed(1), it.v, METAL[metal][0], s.on ? '나옴' : '안 나옴', s.on ? Math.round(s.rate) : 0, s.on ? s.k.toFixed(2) : '—']); }, true], ['표 지우기', () => tab.clear()]]);
      const tab = recTable(panel, ['파장 nm', 'f ×10¹⁴', '세기', '금속', '전자', '개/초', 'Ek eV']);
      panel.append(el('p', { class: 'hint' }, 'f: 진동수(Hz), Ek: 전자의 최대 운동 에너지'));
      panel.append(el('div', { class: 'note', html: o.note }));
      function st() { const E = 1240 / wl.v, W = METAL[metal][1], f = 3e8 / (wl.v * 1e-9) / 1e14; const on = E > W; return { E, W, f, on, k: E - W, rate: on ? it.v * 1.2 : 0 }; }
      function upd() { const s = st(); rd.f.textContent = s.f.toFixed(1) + ' × 10¹⁴ Hz'; if (rd.e) rd.e.textContent = s.E.toFixed(2) + ' eV'; rd.w.textContent = s.W + ' eV'; rd.n.textContent = s.on ? Math.round(s.rate) + '개' : '0개'; rd.k.textContent = s.on ? s.k.toFixed(2) + ' eV' : '—'; }
      const ph = [], ele = []; let acc = 0, eacc = 0, ph_t = 0;
      function frame(dt) {
        const { ctx, W, H } = C; if (!W) return; const s = st();
        const px = W * .66, top = H * .12, bot = H * .88, lx = W * .08, ly = H * .5;
        ph_t += dt;
        // 광자/파동 생성
        if (o.photons) {
          acc += dt * it.v * .35;
          while (acc > 1) { acc -= 1; const ty = top + 20 + Math.random() * (bot - top - 40); ph.push({ x: lx + 30, y0: ly, ty, t: 0 }); }
        } else if (s.on) { eacc += dt * s.rate * .25; }
        ctx.clearRect(0, 0, W, H);
        // 램프
        ctx.fillStyle = '#3B4252'; rrect(ctx, lx - 34, ly - 28, 56, 56, 10); ctx.fill();
        ctx.fillStyle = wlColor(wl.v); ctx.beginPath(); ctx.arc(lx + 22, ly, 14, 0, 7); ctx.fill();
        text(ctx, '광원', lx - 6, ly + 50, { align: 'center', size: 14, color: css('--sub') });
        // 금속판
        ctx.fillStyle = '#B9BFCB'; ctx.fillRect(px, top, 18, bot - top); ctx.strokeStyle = '#7D8494'; ctx.strokeRect(px, top, 18, bot - top);
        text(ctx, METAL[metal][0] + ' 판', px + 9, bot + 22, { align: 'center', size: 14, color: css('--sub') });
        const lam = Math.max(10, wl.v / 18);
        if (o.photons) {
          for (let i = ph.length - 1; i >= 0; i--) {
            const p = ph[i]; p.t += dt * 1.1; const x = lx + 30 + (px - lx - 30) * p.t, y = p.y0 + (p.ty - p.y0) * p.t;
            if (p.t >= 1) { ph.splice(i, 1); if (s.on && Math.random() < .55) ele.push({ x: px + 20, y: p.ty, vx: 60 + 150 * Math.sqrt(s.k), vy: (Math.random() - .5) * 60 }); continue; }
            ctx.strokeStyle = wlColor(wl.v); ctx.lineWidth = 2.5; ctx.beginPath();
            const a = Math.atan2(p.ty - p.y0, px - lx - 30);
            for (let k = -14; k <= 14; k++) { const u = k, env = Math.cos(k / 14 * Math.PI / 2); const ox = x + u * Math.cos(a) - Math.sin(a) * 5 * env * Math.sin(u / lam * 2 * Math.PI * 1.6), oy = y + u * Math.sin(a) + Math.cos(a) * 5 * env * Math.sin(u / lam * 2 * Math.PI * 1.6); k === -14 ? ctx.moveTo(ox, oy) : ctx.lineTo(ox, oy); }
            ctx.stroke();
          }
        } else {
          // 연속 파동으로 그린 빛
          const alpha = .15 + .8 * it.v / 100;
          if (it.v > 0) {
            ctx.save(); ctx.beginPath(); ctx.moveTo(lx + 30, ly - 10); ctx.lineTo(px, top + 10); ctx.lineTo(px, bot - 10); ctx.lineTo(lx + 30, ly + 10); ctx.closePath(); ctx.fillStyle = wlColor(wl.v, alpha * .25); ctx.fill(); ctx.clip();
            ctx.strokeStyle = wlColor(wl.v, alpha); ctx.lineWidth = 2;
            const n = 7;
            for (let r = 0; r < n; r++) { const ty = top + 20 + (bot - top - 40) * r / (n - 1); ctx.beginPath(); for (let u = 0; u <= 1.001; u += .004) { const x = lx + 30 + (px - lx - 30) * u, y = ly + (ty - ly) * u + 4 * Math.sin((x - ph_t * 140) / lam * 2 * Math.PI * .5); u === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
            ctx.restore();
          }
          while (eacc > 1) { eacc -= 1; ele.push({ x: px + 20, y: top + 20 + Math.random() * (bot - top - 40), vx: 60 + 150 * Math.sqrt(s.k), vy: (Math.random() - .5) * 60 }); }
        }
        for (let i = ele.length - 1; i >= 0; i--) {
          const e = ele[i]; e.x += e.vx * dt; e.y += e.vy * dt; if (e.x > W + 10) { ele.splice(i, 1); continue; }
          ctx.fillStyle = css('--acc'); ctx.beginPath(); ctx.arc(e.x, e.y, 7, 0, 7); ctx.fill(); text(ctx, '−', e.x, e.y + 5, { align: 'center', color: '#fff', bold: true, size: 14 });
        }
        text(ctx, s.on ? '전자가 나온다' : '전자가 나오지 않는다', W * .84, H * .08 + 10, { align: 'center', bold: true, size: 17, color: s.on ? css('--acc') : css('--bad') });
      }
      ready = true; upd();
      return { frame, show: () => C.fit() };
    },
  };
}

SIM.add({
  id: 'bits', label: '1차시 비트 카드', title: '이진수 카드로 수 나타내기',

  build(stage, panel) {

    let n = 5, bits = Array(8).fill(0), target = null;
    slider(panel, '카드 수(비트 수)', 1, 8, 1, 5, v => v + '장', v => { n = v; bits = bits.map((b, i) => i < n ? b : 0); draw(); });
    btns(panel, [['모두 뒷면', () => { bits.fill(0); draw(); }], ['13 만들기 도전', () => { target = 13; draw(); }, true], ['무작위 도전', () => { target = Math.floor(Math.random() * 2 ** n); draw(); }]]);
    panel.append(el('div', { class: 'note', html: '<b>생각해 보기</b><br>③ 카드 5장으로 나타낼 수 있는 가장 큰 수는? 모두 몇 가지 수를 나타낼 수 있는가?<br>④ 카드 5장을 <b>한 번</b> 늘어놓았을 때, 그 배열이 나타내는 수는 몇 개인가?' }));
    panel.append(el('div', { class: 'note', html: 'n비트는 <b>2ⁿ가지</b> 상태를 나타낼 수 있지만, 한 번 늘어놓은 카드는 <b>하나의 수</b>만 나타낸다.' }));
    let hit = [];
    function draw() {
      const { ctx, W, H } = C; if (!W) return; ctx.clearRect(0, 0, W, H); hit = [];
      const cw = Math.min(120, (W - 40) / n - 14), ch = cw * 1.4, gap = 14, x0 = (W - (n * cw + (n - 1) * gap)) / 2, y0 = H * .5 - ch / 2;
      let val = 0;
      for (let i = 0; i < n; i++) {

        ctx.fillStyle = b ? '#fff' : css('--acc'); ctx.strokeStyle = css('--acc'); ctx.lineWidth = 2; rrect(ctx, x, y0, cw, ch, 10); ctx.fill(); ctx.stroke();
        if (b) {
          const dots = 2 ** pw, cols = Math.ceil(Math.sqrt(dots)), rows = Math.ceil(dots / cols), r = Math.min(cw / (cols * 2.6), ch * .55 / (rows * 2.6), 9);
          for (let k = 0; k < dots; k++) { const cx = x + cw / 2 + (k % cols - (cols - 1) / 2) * r * 2.6, cy = y0 + ch * .42 + (Math.floor(k / cols) - (rows - 1) / 2) * r * 2.6; ctx.fillStyle = css('--acc2'); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); }
          val += dots;
        }
        text(ctx, b ? '1' : '0', x + cw / 2, y0 + ch + 34, { align: 'center', bold: true, size: 26, color: css('--acc') });
        text(ctx, `${2 ** pw}`, x + cw / 2, y0 - 12, { align: 'center', size: 14, color: css('--sub') });
        if (!b) text(ctx, '뒷면', x + cw / 2, y0 + ch / 2 + 6, { align: 'center', size: 15, color: '#fff' });
      }
      const s = bits.slice(0, n).reverse().join('');
      rd.b.textContent = s; rd.d.textContent = val; rd.n.textContent = `0 ~ ${2 ** n - 1} (${2 ** n}가지)`;
      if (target !== null) {

        text(ctx, ok ? `성공! ${target} = ${s}` : `목표: ${target}을(를) 만들어 보자`, W / 2, y0 - 44, { align: 'center', bold: true, size: 20, color: ok ? css('--good') : css('--ink') });

    }

SIM.add({
  id: 'buildup', label: '3차시 광자 하나씩', title: '광자를 하나씩 이중 슬릿에 보내기',
  hint: '광자를 하나씩 보내면서 다음 광자가 어디에 찍힐지 예측해 본다. 많이 쌓이면 무엇이 보이는가?',
  build(stage, panel) {

    const NB = 400, pdf = [], xs = [];
    for (let i = 0; i < NB; i++) { const x = (i + .5) / NB * 2 - 1; xs.push(x); pdf.push(Math.cos(Math.PI * x * 4.5) ** 2 * (Math.sin(Math.PI * x * 1.6) / (Math.PI * x * 1.6 || 1)) ** 2); }

    const add = k => { for (let i = 0; i < k; i++) { const b = pick(); const x = xs[b] + (Math.random() - .5) / NB * 2; dots.push([x, Math.random()]); hist[b]++; flash = [x, dots[dots.length - 1][1]]; } upd(); };
    btns(panel, [['1개', () => add(1), true], ['10개', () => add(10)], ['100개', () => add(100)], ['1000개', () => add(1000)]]);
    btns(panel, [['자동 보내기', () => { auto = auto ? 0 : 1; }], ['지우기', () => { dots = []; hist.fill(0); flash = null; upd(); }]]);
    check(panel, '위치별 개수(막대) 보기', false, v => { showHist = v; });
    check(panel, '파동으로 계산한 간섭무늬 겹쳐 보기', false, v => { showWave = v; });
    panel.append(el('div', { class: 'note', html: '<b>추론 카드 R1 통계적 행동</b><br>양자 객체 <b>하나</b>의 측정 결과는 미리 예측할 수 없다. 그러나 같은 조건으로 <b>많이</b> 반복하면 결과의 분포는 정확하게 예측할 수 있다.' }));
    function upd() { rd.n.textContent = dots.length.toLocaleString() + '개'; rd.last.textContent = flash ? (flash[0] * 10).toFixed(1) + ' (가운데 = 0)' : '—'; }
    let accu = 0;

      if (flash) { ctx.strokeStyle = '#FF6B4A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx + (flash[0] + 1) / 2 * sw, sy + 6 + flash[1] * (sh - 12), 9, 0, 7); ctx.stroke(); }
      if (showWave) { ctx.strokeStyle = 'rgba(120,200,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); pdf.forEach((p, i) => { const X = sx + (i + .5) / NB * sw, Y = sy + sh - 4 - p * (sh * .9); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); }

    C.cv.addEventListener('pointerdown', e => { drag = true; mv(e); }); window.addEventListener('pointerup', () => drag = false);
    C.cv.addEventListener('pointermove', e => drag && mv(e));
    function mv(e) { const [x, y] = pos(e), { ox, oy } = geo(); if (x < ox - 20 || x > C.W * .6) return; const a = Math.atan2(oy - y, x - ox) * 180 / Math.PI; s.set(Math.round(Math.max(0, Math.min(90, a)))); }
    C.onfit = draw; upd();
    return { show: () => { C.fit(); draw(); } };
  },
});

SIM.add({
  id: 'measure', label: '5차시 측정', title: '측정하면 상태가 확정된다',
  hint: '상태를 준비하고 측정한다. 측정 직후 같은 측정을 다시 하면 어떻게 되는가?',
  build(stage, panel) {
    const C = mkCanvas(stage);
    const rd = chips(stage, [['s', '지금 상태'], ['r', '마지막 결과'], ['h', '기록']]);
    let prep = 45, cur = 45, last = null, measured = false, hist = [], anim = 0;
    const s = slider(panel, '준비할 상태(0 축과 이루는 각)', 0, 90, 5, 45, v => v + '°', v => { prep = v; reset(); });
    btns(panel, [['측정하기', () => measure(), true], ['같은 측정 다시', () => measure()]]);
    btns(panel, [['상태 다시 준비', () => reset()], ['기록 지우기', () => { hist = []; upd(); }]]);
    panel.append(el('div', { class: 'note', html: '<b>추론 카드 R3 측정의 확정성</b><br>측정하면 언제나 <b>하나의 분명한 값</b>이 나온다. 그러나 측정 전에 그 값을 이미 가지고 있었다고 말할 수는 없다. 측정 직후 같은 측정을 반복하면 같은 값이 나온다.' }));
    function reset() { cur = prep; last = null; measured = false; hist.push('│'); upd(); }
    function measure() { const p = Math.cos(cur * Math.PI / 180) ** 2; last = Math.random() < p ? 0 : 1; cur = last ? 90 : 0; measured = true; hist.push(String(last)); anim = 1; upd(); }
    function upd() { rd.s.textContent = measured ? `${last === 0 ? '가로(0)' : '세로(1)'}로 확정` : `${cur}° (준비한 상태)`; rd.r.textContent = last === null ? '—' : last; rd.h.textContent = hist.filter(x => x !== '│').length ? hist.join(' ').replace(/^│ ?/, '') : '—'; }
    function frame(dt) {
      anim = Math.max(0, anim - dt * 2);
      const { ctx, W, H } = C; if (!W) return; ctx.clearRect(0, 0, W, H);
      const cx = W * .32, cy = H * .55, R = Math.min(W * .22, H * .36);
      ctx.fillStyle = css('--tint'); ctx.beginPath(); ctx.arc(cx, cy, R * 1.25, 0, 7); ctx.fill();
      arrow(ctx, cx, cy, cx + R * 1.15, cy, css('--sub'), 2, 9); arrow(ctx, cx, cy, cx, cy - R * 1.15, css('--sub'), 2, 9);
      text(ctx, '0', cx + R * 1.2, cy + 6, { bold: true, size: 18 }); text(ctx, '1', cx - 6, cy - R * 1.2, { bold: true, size: 18 });
      const t = cur * Math.PI / 180; arrow(ctx, cx, cy, cx + R * Math.cos(t), cy - R * Math.sin(t), css('--acc2'), 7, 18);
      text(ctx, measured ? '측정 후' : '측정 전', cx, cy + R * 1.25 + 30, { align: 'center', bold: true, size: 18, color: css('--acc') });
      const p0 = Math.cos(t) ** 2;
      text(ctx, `다음 측정에서 0이 나올 확률 ${(p0 * 100).toFixed(0)}%, 1이 나올 확률 ${((1 - p0) * 100).toFixed(0)}%`, cx, H * .08 + 8, { align: 'center', size: 15, color: css('--sub') });
      // 결과 표시
      const bx = W * .7, by = H * .5;
      ctx.fillStyle = css('--acc'); rrect(ctx, bx - 70, by - 70, 140, 140, 18); ctx.fill();
      text(ctx, last === null ? '?' : String(last), bx, by + 26 * (1 + anim * .3), { align: 'center', bold: true, size: 74 * (1 + anim * .3), color: '#fff' });
      text(ctx, '측정 결과', bx, by - 86, { align: 'center', size: 16, color: css('--sub') });
    }
    upd();
    return { frame, show: () => C.fit() };
  },
});

SIM.add({
  id: 'photon3', label: '5차시 광자와 편광판', title: '편광판 세 장을 광자 하나로 다시 보기',
  hint: '광자를 하나씩 보낸다. 각 편광판은 광자에게 “이 방향이냐, 수직 방향이냐?”를 묻는 측정 장치이다.',
  build(stage, panel) {
    const C = mkCanvas(stage);
    const rd = chips(stage, [['n', '보낸 광자'], ['a', '0° 통과'], ['b', '가운데 통과'], ['c', '90° 통과(끝까지)'], ['r', '0° 통과한 것 중 끝까지']]);
    let mid = true, midA = 45, flying = [], cnt = { n: 0, a: 0, b: 0, c: 0 }, queue = 0;
    check(panel, '가운데 편광판 넣기', true, v => { mid = v; clear(); });
    slider(panel, '가운데 편광판의 투과축', 0, 90, 5, 45, v => v + '°', v => { midA = v; clear(); });
    btns(panel, [['1개', () => queue += 1, true], ['10개', () => queue += 10], ['100개', () => queue += 100], ['1000개 바로', () => { for (let i = 0; i < 1000; i++) run(); upd(); }]]);
    btns(panel, [['지우기', () => clear()]]);
    panel.append(el('div', { class: 'note', html: '<b>예측</b>: 0° 편광판을 통과한 광자 가운데 몇 분의 몇이 끝까지 통과할까?<br>통과한 광자는 그 편광판의 투과축 방향 상태로 <b>새로 준비</b>된다. 45°이면 1/2 × 1/2 = <b>1/4</b>.' }));
    function clear() { flying = []; cnt = { n: 0, a: 0, b: 0, c: 0 }; queue = 0; upd(); }
    function run() { // 광자 하나의 운명: [통과한 편광판 수, 최종]
      cnt.n++; let st = null; const stages = mid ? [0, midA, 90] : [0, 90]; let k = 0;
      for (const ang of stages) { const p = st === null ? .5 : Math.cos((ang - st) * Math.PI / 180) ** 2; if (Math.random() < p) { st = ang; k++; } else break; }
      if (k >= 1) cnt.a++; if (mid && k >= 2) cnt.b++; if (k === stages.length) cnt.c++;
      return { k, stages };
    }
    function upd() { rd.n.textContent = cnt.n; rd.a.textContent = cnt.a; rd.b.textContent = mid ? cnt.b : '—'; rd.c.textContent = cnt.c; rd.r.textContent = cnt.a ? (cnt.c / cnt.a * 100).toFixed(1) + '%' : '—'; }
    let tq = 0;
    function frame(dt) {
      tq += dt; if (queue > 0 && tq > (queue > 20 ? .03 : .35)) { tq = 0; queue--; const f = run(); flying.push({ x: 0, ...f }); }
      const { ctx, W, H } = C; if (!W) return; ctx.clearRect(0, 0, W, H);
      const y = H * .5, x0 = W * .06, xe = W * .94, xs = mid ? [W * .3, W * .52, W * .74] : [W * .3, W * .74], angs = mid ? [0, midA, 90] : [0, 90];
      ctx.fillStyle = '#FFD25A'; ctx.beginPath(); ctx.arc(x0, y, 18, 0, 7); ctx.fill();
      text(ctx, '단일 광자 광원', x0, y + 44, { align: 'center', size: 13, color: css('--sub') });
      xs.forEach((x, i) => {
        ctx.fillStyle = 'rgba(120,135,170,.25)'; ctx.strokeStyle = css('--acc'); ctx.lineWidth = 2; rrect(ctx, x - 7, y - H * .22, 14, H * .44, 4); ctx.fill(); ctx.stroke();
        text(ctx, angs[i] + '°', x, y - H * .22 - 12, { align: 'center', bold: true, size: 18, color: css('--acc') });
      });
      ctx.fillStyle = '#2A2F3A'; ctx.fillRect(xe, y - H * .2, 10, H * .4); text(ctx, '검출기', xe + 5, y + H * .2 + 20, { align: 'center', size: 13, color: css('--sub') });
      const pts = [x0, ...xs, xe];
      for (let i = flying.length - 1; i >= 0; i--) {
        const f = flying[i]; f.x += dt * .45; const X = x0 + (xe - x0) * f.x;
        const stop = f.k < f.stages.length ? xs[f.k] : xe;
        if (X >= stop) { f.dead = (f.dead || 0) + dt; if (f.dead > .5) { flying.splice(i, 1); upd(); } }
        const px = Math.min(X, stop);
        // 지금 상태(마지막으로 통과한 편광판)
        let st = null; xs.forEach((x, j) => { if (px >= x && j < f.k) st = f.stages[j]; });
        ctx.fillStyle = f.dead && f.k < f.stages.length ? 'rgba(178,58,42,.6)' : css('--acc2');
        ctx.beginPath(); ctx.arc(px, y, 8, 0, 7); ctx.fill();
        if (st !== null) { const a = st * Math.PI / 180; ctx.strokeStyle = css('--acc'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px - 16 * Math.cos(a), y + 16 * Math.sin(a)); ctx.lineTo(px + 16 * Math.cos(a), y - 16 * Math.sin(a)); ctx.stroke(); }
      }
      text(ctx, '광자 옆 막대 = 지금 광자의 편광 상태 (빨간 점 = 흡수됨)', W / 2, H * .08 + 6, { align: 'center', size: 14, color: css('--sub') });
    }
    upd();
    return { frame, show: () => C.fit() };
  },
});
